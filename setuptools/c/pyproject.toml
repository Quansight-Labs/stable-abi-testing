[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[project]
name = "limited-api"
version = "1.2.3"

[[tool.setuptools.ext-modules]]
name = "limited"
sources = ["limited.c"]
py-limited-api = true
# define-macros is broken: https://github.com/pypa/setuptools/issues/4810
extra-compile-args = [
    "-DPy_LIMITED_API=0x030f0000",
    "-D_Py_OPAQUE_PYOBJECT",
]
