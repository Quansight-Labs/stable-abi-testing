[dependency-groups]
backends = [
  "meson-python",
  "scikit-build-core",
  "setuptools",
]
test = [
  "build",
  "pytest",
  "pytest-xdist",
  { include-group = "backends" },
]

[tool.pytest]
testpaths = ["tests"]

[tool.tox]
requires = ["tox>=4.22"]
env_list = ["3.15", "3.15t"]
skipsdist = true

[tool.tox.env_run_base]
commands = [
  ["pytest", "-n", "auto"],
]
dependency_groups = ["test"]
